<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsicoEduca - Sistema de Evaluaciones</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧠 PsicoEduca</h1>
      <p>Sistema de evaluaciones psicométricas - STAI, BDI, BFI-5, SCL-90-R</p>
    </header>

    <nav>
      <button class="nav-btn active" data-section="dashboard">📊 Dashboard</button>
      <button class="nav-btn" data-section="nuevo">➕ Nueva Evaluación</button>
      <button class="nav-btn" data-section="resultados">📈 Resultados</button>
    </nav>

    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
